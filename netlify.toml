[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API: /api/v1/... -> https://open-api.delcom.org/api/v1/...
[[redirects]]
  from = "/api/*"
  to = "https://open-api.delcom.org/api/:splat"
  status = 200
  force = true

# SPA fallback agar route Vue Router tidak 404 saat dibuka langsung
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
